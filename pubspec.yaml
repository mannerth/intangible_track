name: intangible_track
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_svg: ^2.3.0
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.5
  json_annotation: ^4.12.0
  flutter_web_auth_2: ^5.0.3
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  riverpod_generator: ^4.0.4
  flutter_native_splash: ^2.4.8

# 启动扉页
flutter_native_splash:
  android: true
  ios: true
  web: false
  
  color: '#FDF5E1'
  background_image: assets/扉页.png
  fullscreen: true

  # Android 12 特殊配置
  android_12:
    color: '#FDF5E1'
    # image: assets/图标.png
    icon_background_color: '#FDF5E1'
    branding: assets/山.png

    

# 应用图标
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/图标.png"  # 图标路径
  adaptive_icon_background: "#FFFFFF"  # Android 适应性图标背景色


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/map/
    - assets/hanxiu/
